<pre style="background-color:#282a36;color:#f8f8f2;"><code><span>$_SERVER[&#39;HTTPS&#39;] = &#39;on&#39;;

</span><span>define(&#39;FORCE_SSL_ADMIN&#39;, true);
</span></code></pre>
