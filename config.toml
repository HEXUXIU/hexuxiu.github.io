# Zola config
base_url = "https://blog.o0o.top"
title = "贺煦修的博客"
description = "贺煦修的个人博客"
default_language = "zh-CN"

[search]
index_format = "elasticlunr_javascript"

# 编译选项
compile_sass = true
minify_html = true
generate_feeds = true
feed_filenames = ["atom.xml"]

# 分类
taxonomies = [
    { name = "tags", feed = true },
    { name = "categories", feed = true },
]

[markdown]
highlight_code = true
highlight_theme = "dracula"
smart_punctuation = true
render_emoji = true

[extra]
author = "贺煦修"
github = "https://github.com/HEXUXIU"
email = "hexuiu@gmail.com"